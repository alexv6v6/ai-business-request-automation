<svg width="980" height="230" viewBox="0 0 980 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font: 600 15px Inter, Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .text { font: 400 12px Inter, Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Node 1: Email Intake -->
  <rect class="box" x="20" y="50" width="130" height="90" rx="14"/>
  <text class="title" x="85" y="85">Email Intake</text>
  <text class="text" x="85" y="108">Outlook trigger</text>

  <line class="arrow" x1="150" y1="95" x2="210" y2="95"/>

  <!-- Node 2: Content Processing -->
  <rect class="box" x="210" y="50" width="150" height="90" rx="14"/>
  <text class="title" x="285" y="85">Content Processing</text>
  <text class="text" x="285" y="108">Cleanup &amp; extraction</text>

  <line class="arrow" x1="360" y1="95" x2="420" y2="95"/>

  <!-- Node 3: AI Classification -->
  <rect class="box" x="420" y="50" width="150" height="90" rx="14"/>
  <text class="title" x="495" y="85">AI Classification</text>
  <text class="text" x="495" y="108">LLM + schema extraction</text>

  <line class="arrow" x1="570" y1="95" x2="630" y2="95"/>

  <!-- Node 4: Business Catalog -->
  <rect class="box" x="630" y="50" width="150" height="90" rx="14"/>
  <text class="title" x="705" y="85">Business Catalog</text>
  <text class="text" x="705" y="108">Request mapping</text>

  <line class="arrow" x1="780" y1="95" x2="840" y2="95"/>

  <!-- Node 5: PostgreSQL -->
  <rect class="box" x="840" y="50" width="120" height="90" rx="14"/>
  <text class="title" x="900" y="85">PostgreSQL</text>
  <text class="text" x="900" y="108">Parameterized SQL</text>

  <line class="arrow" x1="900" y1="140" x2="900" y2="175"/>

  <!-- Node 6: Final Output -->
  <rect class="box" x="780" y="175" width="240" height="35" rx="8"/>
  <text class="text" x="900" y="197">Excel report + automated response</text>
</svg>
