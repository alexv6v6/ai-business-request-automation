<svg width="980" height="220" viewBox="0 0 980 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .title { font: 600 15px Inter, Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 12px Inter, Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #2563eb; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#2563eb" />
    </marker>
  </defs>

  <rect class="box" x="20" y="60" width="130" height="90"/>
  <text class="title" x="45" y="95">Email Intake</text>
  <text class="text" x="38" y="118">Outlook trigger</text>

  <line class="arrow" x1="150" y1="105" x2="210" y2="105"/>

  <rect class="box" x="210" y="60" width="150" height="90"/>
  <text class="title" x="232" y="95">Content Processing</text>
  <text class="text" x="228" y="118">Cleanup & extraction</text>

  <line class="arrow" x1="360" y1="105" x2="420" y2="105"/>

  <rect class="box" x="420" y="60" width="150" height="90"/>
  <text class="title" x="450" y="95">AI Classification</text>
  <text class="text" x="440" y="118">LLM + schema extraction</text>

  <line class="arrow" x1="570" y1="105" x2="630" y2="105"/>

  <rect class="box" x="630" y="60" width="150" height="90"/>
  <text class="title" x="650" y="95">Business Catalog</text>
  <text class="text" x="648" y="118">Request mapping</text>

  <line class="arrow" x1="780" y1="105" x2="840" y2="105"/>

  <rect class="box" x="840" y="60" width="120" height="90"/>
  <text class="title" x="858" y="95">PostgreSQL</text>
  <text class="text" x="850" y="118">Parameterized SQL</text>

  <line class="arrow" x1="900" y1="150" x2="900" y2="185"/>

  <rect class="box" x="760" y="185" width="200" height="30"/>
  <text class="text" x="790" y="205">Excel report + automated response</text>
</svg>
