<svg xmlns="http://www.w3.org/2000/svg" width="980" height="240" viewBox="0 0 980 240">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->

  <rect width="980" height="240" fill="#ffffff"/>

  <!-- Email Intake -->

  <rect x="20" y="50" width="130" height="90" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="85" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Email Intake</text>
  <text x="85" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Outlook trigger</text>

  <line x1="150" y1="95" x2="210" y2="95" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Content Processing -->

  <rect x="210" y="50" width="150" height="90" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="285" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Content Processing</text>
  <text x="285" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Cleanup and extraction</text>

  <line x1="360" y1="95" x2="420" y2="95" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- AI Classification -->

  <rect x="420" y="50" width="150" height="90" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="495" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0f172a">AI Classification</text>
  <text x="495" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">LLM and schema extraction</text>

  <line x1="570" y1="95" x2="630" y2="95" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Business Catalog -->

  <rect x="630" y="50" width="150" height="90" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="705" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Business Catalog</text>
  <text x="705" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Request mapping</text>

  <line x1="780" y1="95" x2="840" y2="95" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- PostgreSQL -->

  <rect x="840" y="50" width="120" height="90" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="900" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#0f172a">PostgreSQL</text>
  <text x="900" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">Parameterized SQL</text>

  <!-- Down arrow -->

  <line x1="900" y1="140" x2="900" y2="175" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Final Output -->

  <rect x="690" y="175" width="270" height="45" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="825" y="196" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0f172a">Excel report</text>
  <text x="825" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0f172a">Automated response</text>
</svg>
