<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->

  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- Title -->

  <text x="60" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0f172a">
    AI Business Request Automation Workflow
  </text>
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b">
    Knowledge-driven business automation with AI classification, Text-to-SQL, and human validation
  </text>

  <!-- Top flow -->

  <rect x="60" y="130" width="160" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="140" y="160" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#0f172a">Incoming Email</text>
  <text x="140" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Request received</text>

  <line x1="220" y1="165" x2="280" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="280" y="130" width="180" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="370" y="160" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#0f172a">Content Extraction</text>
  <text x="370" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Cleanup and normalization</text>

  <line x1="460" y1="165" x2="520" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="130" width="190" height="70" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="615" y="160" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#0f172a">AI Classification</text>
  <text x="615" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Category and parameter extraction</text>

  <line x1="710" y1="165" x2="770" y2="165" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="770" y="130" width="190" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="865" y="160" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#0f172a">Business Catalog</text>
  <text x="865" y="180" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Controlled business knowledge</text>

  <!-- Down -->

  <line x1="865" y1="200" x2="865" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SQL -->

  <rect x="710" y="260" width="310" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="865" y="292" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#0f172a">Text-to-SQL Engine</text>
  <text x="865" y="315" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Parameterized SQL generation</text>
  <text x="865" y="335" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Business rule validation</text>

  <line x1="865" y1="350" x2="865" y2="410" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->

  <rect x="710" y="420" width="310" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="865" y="452" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#0f172a">PostgreSQL</text>
  <text x="865" y="475" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Validated data retrieval</text>
  <text x="865" y="495" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Structured analytical dataset</text>

  <line x1="710" y1="465" x2="560" y2="580" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Report generation -->

  <rect x="300" y="540" width="220" height="80" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="572" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#0f172a">Excel Report</text>
  <text x="410" y="592" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Business report generation</text>

  <line x1="520" y1="580" x2="610" y2="580" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Draft response -->

  <rect x="610" y="540" width="250" height="80" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="735" y="572" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#0f172a">Draft Response</text>
  <text x="735" y="592" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">AI-generated email draft</text>

  <line x1="860" y1="580" x2="950" y2="580" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Human review -->

  <rect x="950" y="540" width="190" height="80" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1045" y="570" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#0f172a">Human Review</text>
  <text x="1045" y="590" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">Validation and approval</text>

  <line x1="1045" y1="620" x2="1045" y2="680" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final email -->

  <rect x="930" y="690" width="230" height="50" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="1045" y="720" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#0f172a">Final Email Sent</text>

  <!-- Principle box -->

  <rect x="60" y="260" width="560" height="220" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="90" y="295" font-family="Arial" font-size="18" font-weight="bold" fill="#0f172a">
    Core architectural principle
  </text>

  <text x="90" y="330" font-family="Arial" font-size="14" fill="#334155">
    AI interprets the request.
  </text>
  <text x="90" y="355" font-family="Arial" font-size="14" fill="#334155">
    The business catalog controls the business logic.
  </text>
  <text x="90" y="380" font-family="Arial" font-size="14" fill="#334155">
    Parameterized SQL executes approved business rules.
  </text>
  <text x="90" y="405" font-family="Arial" font-size="14" fill="#334155">
    Human review validates the final communication.
  </text>

  <line x1="90" y1="430" x2="590" y2="430" stroke="#e2e8f0" stroke-width="1"/>

  <text x="90" y="460" font-family="Arial" font-size="13" fill="#64748b">
    Knowledge → Information Model → Business Rules → AI Assistance → Human Validation
  </text>

  <!-- Footer -->

  <text x="60" y="740" font-family="Arial" font-size="12" fill="#64748b">
    Business Systems Design • Knowledge Architecture • AI-Assisted Automation • Human-in-the-Loop
  </text>
</svg>
